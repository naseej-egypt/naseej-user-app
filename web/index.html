<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Naseej - Your premium carpet & textile store. Shop the finest handcrafted carpets and rugs.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Naseej">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Naseej</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading screen styles */
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #F1E9DB 0%, #E8DCC8 100%);
      font-family: 'Cairo', sans-serif;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #E8DCC8;
      border-top: 4px solid #8b3c3c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 20px;
      color: #8b3c3c;
      font-size: 18px;
      font-weight: 600;
    }
    .loading-inner {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="loading-container" id="loading">
    <div class="loading-inner">
      <div class="loading-spinner"></div>
      <div class="loading-text">Naseej</div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
